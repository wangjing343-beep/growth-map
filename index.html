<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FDF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成长地图">
<title>袁珞宸的成长地图</title>
<style>
/* 袁珞宸的成长地图 · 样式（按已确认 V3.1 设计稿实现） */
:root{
  --bg:#FDF6E9; --ink:#3A3A3A; --ink-soft:#8A8578; --card:#FFFFFF;
  --cream:#FFF3D6; --blue:#EAF3FF; --green:#E8F7EC; --pink:#FDEEF0;
  --orange:#FFF0E2; --purple:#F1EDFB;
  --accent:#F5A623; --accent-2:#4A90D9; --accent-3:#5CB878;
  --line:#F0E4CB; --danger:#E26D5C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);}

/* ===== 应用框架：手机竖屏为默认形态 ===== */
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:#FFFDF6;box-shadow:0 0 40px rgba(60,50,20,.08);}
.page{flex:1;display:none;flex-direction:column;padding:16px 16px 90px;position:relative;overflow-y:auto;}
.page.active{display:flex;}

/* 平板 / 宽屏自适应 */
@media (min-width:768px){
  #app{max-width:960px;}
  .page{padding:24px 28px 100px;}
  .grid2{grid-template-columns:repeat(4,1fr) !important;}
  .books-grid,.honors-grid,.foot-list{grid-template-columns:1fr 1fr !important;display:grid !important;gap:12px;}
}

/* ===== 首页：全屏照片背景 ===== */
#page-home{padding:0;}
.home-bg{position:absolute;inset:0;background:linear-gradient(160deg,#8FC7E8 0%,#BFE0C8 55%,#F6E7A8 100%);background-size:cover;background-position:center;}
.home-bg .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,40,60,.08),rgba(30,40,60,.45));}
.home-content{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;flex:1;padding:14px 16px 90px;overflow-y:auto;}
.home-status{display:flex;justify-content:flex-end;align-items:center;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35);}
.sync-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.3);color:#fff;font-size:11px;border-radius:999px;padding:3px 10px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.3);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#8EF0B2;}
.greet{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:16px 16px 34px;position:relative;backdrop-filter:blur(2px);}
.greet .kicker{font-size:10px;letter-spacing:2px;color:#FFE9B8;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.3);}
.greet .big{font-size:21px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35);padding-right:96px;margin-top:2px;}
.greet .m2{font-size:11px;color:rgba(255,255,255,.95);margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.4);padding-right:96px;line-height:1.6;}
/* 星星（长按进入家长模式）+ 星球 */
.star-btn{position:absolute;right:40px;top:6px;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));}
.star-btn.pressing{animation:starGlow 3s linear forwards;}
@keyframes starGlow{0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,215,80,0));}100%{transform:scale(1.35);filter:drop-shadow(0 0 14px rgba(255,215,80,.95));}}
.planet{width:42px;height:42px;border-radius:50%;position:absolute;right:12px;top:10px;background:radial-gradient(circle at 32% 30%,#FFD86B,#F5A623 70%);box-shadow:0 4px 10px rgba(0,0,0,.2);}
.planet::after{content:"";position:absolute;inset:-5px -8px;border:2px solid rgba(255,255,255,.6);border-radius:50%;transform:rotate(-18deg);}
.bg-btn{position:absolute;left:16px;bottom:10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;background:rgba(0,0,0,.28);border-radius:50%;}
.parent-progress{position:absolute;left:0;bottom:0;height:3px;background:#FFD75E;width:0%;border-radius:3px;}
/* 首页入口卡片 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.tile{border-radius:18px;padding:16px 13px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);box-shadow:0 3px 10px rgba(0,0,0,.05);}
.tile:active{transform:scale(.97);}
.tile .icon{font-size:26px;}
.tile .name{font-size:15px;font-weight:800;margin-top:8px;text-align:center;}
.tile .meta{font-size:11px;color:var(--ink-soft);margin-top:3px;text-align:center;}
.t-yellow{background:rgba(255,243,214,.55);} .t-blue{background:rgba(234,243,255,.55);}
.t-green{background:rgba(232,247,236,.55);} .t-pink{background:rgba(253,238,240,.55);}
/* 首页进度与提示 */
.home-card{background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border-radius:16px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.home-card .row1{display:flex;justify-content:space-between;font-size:13px;font-weight:800;}
.bar{height:9px;border-radius:99px;background:#F2EADA;margin-top:10px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F5A623,#FFC95C);transition:width .5s;}
.home-tip{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}
.home-foot{text-align:center;color:rgba(255,255,255,.85);font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,.3);}

/* ===== 通用页面头 ===== */
.kicker{font-size:10px;letter-spacing:2px;color:var(--accent-2);font-weight:700;}
h2.title{font-size:20px;line-height:1.3;margin-top:2px;}
.muted{color:var(--ink-soft);font-size:12px;line-height:1.6;}

/* ===== 底部导航 ===== */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
@media (min-width:768px){.tabbar{max-width:960px;}}
.tab{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.4;font-weight:700;flex:1;padding:2px 0;}
.tab .ico{font-size:18px;display:block;}
.tab.on{color:var(--accent);font-weight:900;}

/* ===== 筛选 chips ===== */
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{font-size:12px;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);font-weight:600;}
.chip.on{background:#3A3A3A;color:#fff;border-color:#3A3A3A;}
.sort-note{font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;}
.sort-note b{color:var(--accent);font-weight:800;}

/* ===== 统计卡 ===== */
.stat-duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.stat-box{border-radius:16px;padding:13px;text-align:center;}
.stat-box .num{font-size:22px;font-weight:900;}
.stat-box .num span{font-size:12px;font-weight:700;}
.stat-box .lab{font-size:10px;color:var(--ink-soft);margin-top:4px;}
.stat-quad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat-quad .stat-box{padding:10px 6px;}
.stat-quad .num{font-size:18px;}

/* ===== 卡片与列表 ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;}
.list-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:11px;align-items:center;}
.item-main{flex:1;min-width:0;}
.item-name{font-size:14px;font-weight:800;}
.item-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.count-tag{background:var(--cream);color:#C77B00;font-size:11px;font-weight:800;border-radius:10px;padding:6px 9px;text-align:center;line-height:1.5;flex:0 0 auto;}
.thumb{width:44px;height:56px;border-radius:8px;flex:0 0 auto;object-fit:cover;}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-size:22px;}

/* 套书 */
.series{background:linear-gradient(135deg,#FFF6E0,#FDEBF2);border:1.5px solid #F2C7D9;border-radius:16px;padding:13px;}
.series .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.series .name{font-size:14px;font-weight:800;}
.badge-set{font-size:10px;background:var(--accent);color:#fff;border-radius:999px;padding:3px 9px;font-weight:800;white-space:nowrap;}
.vol-dots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px;}
.vol{height:22px;border-radius:6px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;border:none;}
.vol.done{background:var(--accent);color:#fff;}
.vol.todo{background:#fff;color:#C9BFA4;border:1px dashed #D9CBA8;}
.vol:active{transform:scale(.9);}
.series .foot{font-size:10px;color:var(--ink-soft);margin-top:8px;}

/* CTA 按钮 */
.cta{background:var(--accent);color:#fff;font-size:15px;font-weight:800;text-align:center;border-radius:15px;padding:13px;box-shadow:0 6px 14px rgba(245,166,35,.35);width:100%;}
.cta:active{transform:scale(.98);}
.cta.blue{background:var(--accent-2);box-shadow:0 6px 14px rgba(74,144,217,.35);}
.cta.green{background:var(--accent-3);box-shadow:0 6px 14px rgba(92,184,120,.35);}
.cta.ghost{background:#fff;color:var(--accent-2);border:1.5px solid var(--accent-2);box-shadow:none;}
.btn-mini{font-size:11px;font-weight:700;border-radius:9px;padding:5px 10px;background:var(--blue);color:var(--accent-2);}
.btn-mini.warn{background:var(--pink);color:var(--danger);}

/* 打卡行 */
.check-row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:11px;}
.check-dot{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900;}
.check-dot.done{background:var(--accent-3);}
.check-dot.todo{background:#E4DCC8;color:#B7AD93 !important;}
.check-row .name{font-size:14px;font-weight:800;flex:1;}
.min-tag{font-size:12px;font-weight:700;color:var(--accent-2);background:var(--blue);border-radius:8px;padding:4px 9px;}
.min-tag.none{color:#B7AD93;background:#F5F0E2;}

/* 荣誉 */
.medal-hero{background:var(--blue);border-radius:18px;padding:15px;display:flex;align-items:center;gap:13px;}
.medal-ball{width:52px;height:52px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 32% 30%,#BFE0FF,#4A90D9 75%);}
.honor-item{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;}
.honor-ico{font-size:22px;}
.rank1{color:#D4A017;} .rank2{color:#8FA3B8;} .rank3{color:#B07A45;}
.honor-photo{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 auto;}

/* 脚步地图 */
.map-wrap{background:linear-gradient(180deg,#EAF3FB,#F4F9F1);border-radius:18px;padding:8px;position:relative;}
.map-wrap svg{width:100%;display:block;}
.land{fill:#CFE8D2;stroke:#9CCB9F;stroke-width:.8;}
.land-sm{fill:#CFE8D2;stroke:#9CCB9F;stroke-width:1;}
.pin-glow{filter:drop-shadow(0 0 4px rgba(245,166,35,.9));}
.pin-label{font-size:12px;font-weight:700;fill:#6B5B2A;}
.pin-label.gray{fill:#A9A08A;font-weight:600;}
.inset-box{fill:#fff;stroke:#C9DCE8;stroke-width:1;}
.inset-title{font-size:11px;fill:#7C93A6;}
.map-caption{font-size:10px;color:var(--ink-soft);text-align:center;margin-top:5px;}
.map-pin{cursor:pointer;}
.memory{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;position:relative;}
.memory .head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.memory .head .name{font-size:14px;font-weight:800;color:#8A5A00;}
.memory .head .date{font-size:10px;color:var(--ink-soft);white-space:nowrap;}
.memory .loc{font-size:11px;color:var(--accent-2);margin-top:3px;font-weight:600;}
.memory .quote{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}
.memory .quote b{color:var(--accent-3);}
.memory .pics{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}
.memory .pics img{width:56px;height:56px;border-radius:8px;object-fit:cover;}
.memory .steps{font-size:10px;color:var(--ink-soft);margin-top:6px;}
/* 南海诸岛淡化角标（合规要求保留，视觉弱化） */
.inset-group{opacity:.35;}
/* 打卡月度柱状图 */
.daybars{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:10px;padding:0 2px;}
.daybars i{flex:1;background:var(--accent-2);border-radius:2px;min-height:3px;opacity:.75;}
.daybar-axis{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-soft);margin-top:4px;}

/* 表单弹层 */
.overlay{position:fixed;inset:0;background:rgba(30,25,10,.5);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#FFFDF6;border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));}
@media (min-width:768px){.overlay{align-items:center;}.sheet{border-radius:22px;max-width:560px;}}
.sheet h3{font-size:17px;margin-bottom:14px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{min-height:70px;resize:vertical;}
.field .row{display:flex;gap:9px;}
.field .row > *{flex:1;}
.photo-pick{display:flex;gap:8px;flex-wrap:wrap;}
.photo-pick .ph-slot{width:64px;height:64px;border-radius:10px;background:var(--cream);border:1.5px dashed #D9CBA8;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B7AD93;overflow:hidden;}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:10px;}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.sheet-actions .cta{flex:1;}
.sheet-actions .cta.cancel{background:#F0E8D5;color:var(--ink-soft);box-shadow:none;}

/* 家长面板 */
.parent-badge{background:var(--purple);color:#7A5FD0;font-size:10px;font-weight:800;border-radius:999px;padding:3px 9px;}
.cal-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;display:flex;gap:10px;align-items:center;}
.cal-item .info{flex:1;min-width:0;}
.cal-item .orig{font-size:11px;color:#B0A88F;margin-top:4px;line-height:1.5;}
.pin-input{letter-spacing:14px;text-align:center;font-size:22px;}

/* Toast 与庆祝动画 */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(40,35,20,.85);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:10px 20px;opacity:0;transition:.3s;z-index:200;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden;}
.celebrate i{position:absolute;top:-30px;font-size:22px;animation:fall 1.6s ease-in forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(340deg);opacity:.6;}}

/* 打印导出 */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;}
  #printArea h1{text-align:center;font-size:22px;margin-bottom:4px;}
  #printArea .p-sub{text-align:center;color:#666;font-size:12px;margin-bottom:16px;}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px;}
  #printArea th,#printArea td{border:1px solid #999;padding:6px 8px;text-align:left;}
  #printArea th{background:#f2f2f2;}
  #printArea .p-sec{margin-top:14px;font-size:15px;font-weight:800;}
}

/* ============================================================
 * 荣誉榜 v1.8 童趣重设计：荣耀王国收集册
 * ============================================================ */
.hn-head .kicker{color:#E86FA0;}
.hn-hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 18px 20px;text-align:center;color:#fff;
  background:linear-gradient(135deg,#6C5CE7 0%,#a55eea 55%,#fd79a8 100%);
  box-shadow:0 8px 24px rgba(108,92,231,.35);}
.hn-hero .hn-trophy{font-size:56px;line-height:1;animation:hnFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));}
.hn-hero .hn-count{font-size:17px;font-weight:800;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.25);}
.hn-hero .hn-count b{font-size:26px;color:#FFE9A8;margin:0 3px;}
.hn-hero .hn-sub{font-size:11.5px;opacity:.92;margin-top:4px;}
.hn-star{position:absolute;font-size:14px;opacity:.85;animation:hnTwinkle 2s ease-in-out infinite;}
.hn-star.s1{left:10%;top:16%;}
.hn-star.s2{right:12%;top:22%;animation-delay:.5s;font-size:18px;}
.hn-star.s3{left:18%;bottom:18%;animation-delay:1s;}
.hn-star.s4{right:20%;bottom:24%;animation-delay:1.4s;font-size:11px;}
@keyframes hnFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes hnTwinkle{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}

/* 金银铜领奖台 */
.hn-podium{display:flex;align-items:flex-end;gap:8px;margin-top:14px;}
.hn-podium .pod{flex:1;border-radius:14px 14px 8px 8px;text-align:center;padding:10px 4px 8px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
.hn-podium .pico{font-size:22px;}
.hn-podium .pnum{font-size:20px;font-weight:900;line-height:1.15;}
.hn-podium .plab{font-size:10px;font-weight:700;opacity:.75;}
.hn-podium .p1{background:linear-gradient(180deg,#FFF3C4,#FFD75E);height:108px;animation:hnPop .45s ease .05s backwards;}
.hn-podium .p2{background:linear-gradient(180deg,#F4F6F8,#C9D3DC);height:84px;animation:hnPop .45s ease .15s backwards;}
.hn-podium .p3{background:linear-gradient(180deg,#FFE8D9,#F0B27A);height:70px;animation:hnPop .45s ease .25s backwards;}
@keyframes hnPop{0%{transform:translateY(16px) scale(.8);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}

/* 荣耀收集墙 */
.hn-walltitle{font-size:13px;font-weight:800;margin:16px 2px 8px;display:flex;align-items:baseline;gap:8px;}
.hn-walltitle span{font-size:10.5px;font-weight:600;color:var(--ink-soft);}
.hn-wall{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
.hn-slot{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:repeating-linear-gradient(45deg,#F1EDE2,#F1EDE2 6px,#EAE5D6 6px,#EAE5D6 12px);
  color:#C9C2AE;font-weight:800;border:1.5px dashed #D8D2C0;}
.hn-slot.on{background:linear-gradient(145deg,#FFF8E1,#FFE9A8);border:1.5px solid #F5C542;animation:hnPop .4s ease backwards;box-shadow:0 3px 8px rgba(245,197,66,.35);}

/* 空状态 */
.hn-empty{text-align:center;padding:34px 18px 30px;background:rgba(255,255,255,.6);border-radius:20px;border:1.5px dashed #D8D2C0;margin-top:14px;}
.hn-empty .big{font-size:54px;animation:hnBounce 1.6s ease-in-out infinite;}
.hn-empty .t1{font-size:16px;font-weight:900;margin-top:8px;color:var(--ink);}

<script>
/* ============================================================
 * 袁珞宸的成长地图 · 数据存储层（三模式）
 *
 * 优先级自动探测：
 *   remote —— 同源存在 /api/* 家庭云服务（node server.js，可选）
 *   cloud  —— 已配置 GitHub Gist 云同步（家长面板里粘贴令牌开启）：
 *             数据存用户自己的私密 gist，多设备同链接实时同步，
 *             换手机 / 清缓存 / 重装都不丢。
 *   local  —— 都未开启：数据存本机（localStorage + IndexedDB）
 *
 * 三种模式对页面暴露同一接口，页面逻辑无需感知差异。
 * ============================================================ */

const DB = (() => {
  const DATA_KEY = 'ycm_data_v1';
  const CLOUD_KEY = 'ycm_cloud';     // 本机保存的云配置 {token, dataGistId, mediaGistId}
  const PHOTO_DB = 'ycm_photos';
  const PHOTO_STORE = 'photos';

  let MODE = 'local';                // 'remote' | 'cloud' | 'local'
  let lastVersion = 0;               // remote 模式版本号
  let cloud = { token: null, dataGistId: null, mediaGistId: null };
  let cloudError = null;

  /* ---------- 默认数据 ---------- */
  function defaultData() {
    return {
      version: 1,
      updatedAt: null,
      settings: {
        childName: '袁珞宸',
        signature: '袁珞宸独家开发',
        bgPhotoId: null,
        bgDim: 0.15,
        pin: null,
        customItems: [],
        checkinItems: ['英语', '数学', '拼音', '练字', '阅读', '运动', '轮滑'],
        encouragements: [
          '今天也完成了一项成长任务，真棒！',
          '每读一本书，都是一次小小冒险！',
          '坚持打卡，成长地图又亮了一格！',
          '你比昨天的自己更厉害了一点点！',
          '继续加油，星星正在排队等你点亮！'
        ]
      },
      books: [],
      honors: [],
      checkins: [],
      footprints: [],
      wishes: []

  let cache = null;

  /* 深度合并默认值：settings 逐字段合并，避免旧/不完整数据缺字段导致页面出错 */
  function mergeDefaults(stored) {
    const d = defaultData();
    const out = Object.assign(d, stored || {});
    out.settings = Object.assign(defaultData().settings, (stored && stored.settings) || {});
    return out;
  }

  /* ---------- GitHub API ---------- */
  function ghHeaders() {
    return {
      'Authorization': 'Bearer ' + cloud.token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
  }

  async function gh(path, opts = {}) {
    const r = await fetch('https://api.github.com' + path, Object.assign({ headers: ghHeaders() }, opts));
    if (!r.ok) {
      const msg = await r.json().catch(() => ({}));
      throw new Error('GitHub API ' + r.status + (msg.message ? ': ' + msg.message : ''));
    }
    return r.json();
  }

  /* ---------- 模式探测与初始化 ---------- */
  async function init() {
    /* 云配置从本机 localStorage 恢复 */
    try { cloud = Object.assign(cloud, JSON.parse(localStorage.getItem(CLOUD_KEY) || '{}')); } catch (e) {}

    /* 1) 家庭服务器模式（可选，优先） */
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 1200);
      const r = await fetch('/api/version', { signal: ctrl.signal });
      clearTimeout(tm);
      if (r.ok) {
        const j = await r.json();
        if (typeof j.version === 'number') { MODE = 'remote'; lastVersion = j.version; return; }
      }
    } catch (e) { /* 继续 */ }

    /* 2) Gist 云同步模式 */
    if (cloud.token && cloud.dataGistId) {
      try {
        await cloudPullOrPush();
        MODE = 'cloud';
        return;
      } catch (e) {
        cloudError = e.message;
        console.error('云同步初始化失败，暂用本机数据', e);
      }
    }
    /* 3) 本机模式 */
    MODE = 'local';
  }

  const isRemote = () => MODE === 'remote';
  const isCloud = () => MODE === 'cloud';
  const getCloudError = () => cloudError;

  /* 云端拉取：远端新则用远端，本地新则推本地 */
  async function cloudPullOrPush() {
    const g = await gh('/gists/' + cloud.dataGistId);
    const f = g.files && g.files['ycm-data.json'];
    let remote = null;
    if (f && f.content) {
      try { remote = JSON.parse(f.content); } catch (e) { remote = null; }
    }
    const localRaw = localStorage.getItem(DATA_KEY);
    const local = localRaw ? mergeDefaults(JSON.parse(localRaw)) : null;

    if (remote && remote.data && (!local || (remote.updatedAt || '') >= (local.updatedAt || ''))) {
      cache = mergeDefaults(remote.data);
    } else if (local) {
      cache = local;
      await cloudPush();
    } else {
      cache = defaultData();
      await cloudPush();
    }
  }

  async function cloudPush() {
    cache.updatedAt = new Date().toISOString();
    const body = { files: { 'ycm-data.json': { content: JSON.stringify({ updatedAt: cache.updatedAt, data: cache }) } } };
    await gh('/gists/' + cloud.dataGistId, { method: 'PATCH', body: JSON.stringify(body) });
  }

  /* 统计一份数据里的记录总数，用于比较哪份云端数据更"富" */
  function dataScore(d) {
    if (!d) return -1;
    return (d.books || []).length + (d.honors || []).length + (d.checkins || []).length + (d.footprints || []).length;
  }

  /* 读取 gist 里 ycm-data.json 的内容（大文件时 content 为空，需再取 raw_url） */
  async function fetchGistData(gist) {
    const f = gist.files && gist.files['ycm-data.json'];
    if (!f) return null;
    let raw = f.content;
    if (!raw && f.raw_url) {
      const r = await fetch(f.raw_url, { headers: ghHeaders() });
      if (!r.ok) return null;
      raw = await r.text();
    }
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  /* 查找账号下已有的成长地图云端，返回数据最丰富的那一个 */
  async function findExistingCloudGist() {
    const r = await gh('/gists?per_page=100');
    const list = Array.isArray(r) ? r : [];
    const cands = list.filter(g => g.files && g.files['ycm-data.json'] && (g.description || '').indexOf('成长地图') >= 0);
    let best = null, bestScore = -1;
    for (const g of cands) {
      const parsed = await fetchGistData(g).catch(() => null);
      const score = dataScore(parsed && parsed.data);
      if (score > bestScore) { bestScore = score; best = g; }
    }
    return best;
  }

  /* 开启云同步：家长面板粘贴 token 后调用。
     若账号下已有成长地图云端，直接采用它并恢复数据（多设备开同一朵云）；
     没有才新建。 */
  async function enableCloud(token) {
    cloud.token = token;
    if (!cache) await load();
    let adopted = null;
    try { adopted = await findExistingCloudGist(); } catch (e) { /* 查找失败就按新建处理 */ }
    if (adopted) {
      cloud.dataGistId = adopted.id;
      MODE = 'cloud';
      saveLocal();
      persistCloudCfg();
      /* 用记录数比较：云端更富则拉云端，本地更富则推本地（避免把空数据覆盖上去） */
      const parsed = await fetchGistData(adopted).catch(() => null);
      const remoteData = parsed && parsed.data ? mergeDefaults(parsed.data) : null;
      if (remoteData && dataScore(remoteData) >= dataScore(cache)) {
        cache = remoteData;
        cache.updatedAt = new Date().toISOString();
        saveLocal();
      } else {
        await cloudPush();
      }
      return { id: adopted.id, adopted: true };
    }
    cache.updatedAt = new Date().toISOString();
    const g = await gh('/gists', {
      method: 'POST',
      body: JSON.stringify({
        description: '袁珞宸的成长地图 · 云端数据（请勿删除）',
        public: false,
        files: { 'ycm-data.json': { content: JSON.stringify({ updatedAt: cache.updatedAt, data: cache }) } }
      })
    });
    cloud.dataGistId = g.id;
    MODE = 'cloud';
    saveLocal();
    persistCloudCfg();
    return { id: g.id, adopted: false };
  }

  /* 诊断：列出账号下所有成长地图云端及各自的数据量 */
  async function listCloudGists() {
    const r = await gh('/gists?per_page=100');
    const list = Array.isArray(r) ? r : [];
    const out = [];
    for (const g of list) {
      if (!g.files || !g.files['ycm-data.json']) continue;
      if ((g.description || '').indexOf('成长地图') < 0) continue;
      /* 列表接口不返回文件内容，必须逐个取详情 */
      const full = await gh('/gists/' + g.id).catch(() => g);
      const parsed = await fetchGistData(full).catch(() => null);
      const d = parsed && parsed.data ? mergeDefaults(parsed.data) : null;
      out.push({
        id: g.id,
        updatedAt: (parsed && parsed.updatedAt) || g.updated_at || '',
        books: d ? d.books.length : 0,
        honors: d ? d.honors.length : 0,
        checkins: d ? d.checkins.length : 0,
        footprints: d ? d.footprints.length : 0,
        score: dataScore(d),
        current: g.id === cloud.dataGistId
      });
    }
    out.sort((a, b) => (b.current ? 1 : 0) - (a.current ? 1 : 0) || b.score - a.score);
    return out;
  }

  /* 手动连接到指定云端：云端数据多则拉取，本地多则推送 */
  async function connectCloudGist(gistId) {
    if (!cloud.token) throw new Error('尚未登录 GitHub');
    const prevId = cloud.dataGistId;
    cloud.dataGistId = gistId;
    MODE = 'cloud';
    try {
      const g = await gh('/gists/' + gistId);
      const parsed = await fetchGistData(g).catch(() => null);
      const remoteData = parsed && parsed.data ? mergeDefaults(parsed.data) : null;
      if (remoteData && dataScore(remoteData) >= dataScore(cache)) {
        cache = remoteData;
        cache.updatedAt = new Date().toISOString();
        saveLocal();
      } else {
        await cloudPush();
      }
      persistCloudCfg();
      return true;
    } catch (e) {
      cloud.dataGistId = prevId;
      persistCloudCfg();
      throw e;
    }
  }

  function disableCloud() {
    cloud = { token: null, dataGistId: null, mediaGistId: null };
    localStorage.removeItem(CLOUD_KEY);
    MODE = 'local';
  }

  function persistCloudCfg() {
    localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud));
  }

  /* ---------- 结构化数据 ---------- */
  function load() {
    if (cache) return Promise.resolve(cache);
    try {
      const raw = localStorage.getItem(DATA_KEY);
      cache = mergeDefaults(raw ? JSON.parse(raw) : null);
    } catch (e) {
      console.error('数据读取失败，使用默认数据', e);
      cache = defaultData();
    }
    return Promise.resolve(cache);
  }

  function saveLocal() {
    try {
      localStorage.setItem(DATA_KEY, JSON.stringify(cache));
    } catch (e) {
      alert('保存失败：本地存储空间不足。请删除部分照片或旧记录后重试。');
      throw e;
    }
  }

  async function save() {
    cache.updatedAt = new Date().toISOString();
    saveLocal();
    if (MODE === 'remote') {
      const r = await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: cache })
      });
      if (!r.ok) throw new Error('家庭云保存失败');
      lastVersion = (await r.json()).version;
    } else if (MODE === 'cloud') {
      try {
        await cloudPush();
        cloudError = null;
      } catch (e) {
        cloudError = e.message;
        console.error('云同步推送失败', e);
        toastSafe('⚠️ 云同步推送失败，数据已存本机，稍后自动重试');
      }
    }
    return true;
  }

  function toastSafe(msg) { if (typeof toast === 'function') toast(msg); }

  async function getVersion() {
    if (MODE === 'remote') {
      try {
        const r = await fetch('/api/version', { cache: 'no-store' });
        return (await r.json()).version;
      } catch (e) { return lastVersion; }
    }
    return 0;
  }

  /* ---------- 同步轮询 ---------- */
  function startSync(onChange, intervalMs = 5000) {
    if (MODE === 'remote') {
      setInterval(async () => {
        try {
          const v = await getVersion();
          if (v !== lastVersion) {
            lastVersion = v;
            const data = await loadRemote();
            onChange && onChange(data);
          }
        } catch (e) { }
      }, intervalMs);
    } else if (MODE === 'cloud') {
      setInterval(async () => {
        try {
          const g = await gh('/gists/' + cloud.dataGistId);
          const f = g.files && g.files['ycm-data.json'];
          if (!f || !f.content) return;
          const remote = JSON.parse(f.content);
          if ((remote.updatedAt || '') > (cache.updatedAt || '')) {
            cache = mergeDefaults(remote.data);
            saveLocal();
            onChange && onChange(cache);
          }
        } catch (e) { /* 网络抖动，下轮再试 */ }
      }, intervalMs);
    }
  }

  async function loadRemote() {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('家庭云读取失败');
    const j = await r.json();
    lastVersion = j.version || lastVersion;
    cache = mergeDefaults(j.data);
    try { localStorage.setItem(DATA_KEY, JSON.stringify(cache)); } catch (e) {}
    return cache;
  }

  /* ---------- 照片：本机 IndexedDB 缓存 + 云 gist 存档 ---------- */
  let pdbPromise = null;
  function pdb() {
    if (!pdbPromise) {
      pdbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(PHOTO_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(PHOTO_STORE)) {
            req.result.createObjectStore(PHOTO_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return pdbPromise;
  }

  function tx(store, mode, fn) {
    return pdb().then(db => new Promise((resolve, reject) => {
      const t = db.transaction(PHOTO_STORE, mode);
      const s = t.objectStore(PHOTO_STORE);
      const r = fn(s);
      t.oncomplete = () => resolve(r && r.result !== undefined ? r.result : r);
      t.onerror = () => reject(t.error);
    }));
  }

  function compressImage(file, maxSide = 1080, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let { width: w, height: h } = img;
          const scale = Math.min(1, maxSide / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function addPhoto(file) {
    const dataUrl = await compressImage(file);
    const id = 'p' + Date.now() + Math.floor(Math.random() * 1000);
    await tx(PHOTO_STORE, 'readwrite', s => s.put(dataUrl, id));
    if (MODE === 'cloud') {
      try {
        const body = { files: {} };
        body.files['photo_' + id + '.txt'] = { content: dataUrl };
        await gh('/gists/' + cloud.dataGistId, { method: 'PATCH', body: JSON.stringify(body) });
      } catch (e) { console.error('照片云端备份失败', e); }
    }
    return id;
  }

  function getPhoto(id) {
    if (!id) return Promise.resolve(null);
    if (MODE === 'remote') return Promise.resolve('/api/photo/' + id);
    return tx(PHOTO_STORE, 'readonly', s => s.get(id)).then(async local => {
      if (local) return local;
      if (MODE === 'cloud') {
        try {
          const g = await gh('/gists/' + cloud.dataGistId);
          const f = g.files && g.files['photo_' + id + '.txt'];
          if (f && f.content) {
            await tx(PHOTO_STORE, 'readwrite', s => s.put(f.content, id));
            return f.content;
          }
        } catch (e) { /* 找不到就算了 */ }
      }
      return null;
    });
  }

  function deletePhoto(id) {
    if (!id) return Promise.resolve();
    const jobs = [tx(PHOTO_STORE, 'readwrite', s => s.delete(id))];
    if (MODE === 'cloud') {
      const body = { files: {} };
      body.files['photo_' + id + '.txt'] = null;
      jobs.push(gh('/gists/' + cloud.dataGistId, { method: 'PATCH', body: JSON.stringify(body) }).catch(() => {}));
    }
    return Promise.all(jobs);
  }

  function putPhoto(id, dataUrl) {
    return tx(PHOTO_STORE, 'readwrite', s => s.put(dataUrl, id)).then(() => id);
  }

  /* ---------- 备份 / 恢复 ---------- */
  async function exportBackup() {
    const data = await load();
    const photos = {};
    const ids = collectPhotoIds(data);
    for (const id of ids) {
      const url = await getPhoto(id);
      if (url) photos[id] = url;
    }
    return { __backup: 'ycm', exportedAt: new Date().toISOString(), data, photos };
  }

  function collectPhotoIds(data) {
    const ids = new Set();
    if (data.settings && data.settings.bgPhotoId) ids.add(data.settings.bgPhotoId);
    (data.books || []).forEach(b => (b.records || []).forEach(r => r.photoId && ids.add(r.photoId)));
    (data.honors || []).forEach(h => h.photoId && ids.add(h.photoId));
    (data.checkins || []).forEach(c => c.photoId && ids.add(c.photoId));
    (data.footprints || []).forEach(f => f.photoId && ids.add(f.photoId));
    return Array.from(ids);
  }

  async function importBackup(obj) {
    if (!obj || obj.__backup !== 'ycm' || !obj.data) throw new Error('备份文件格式不正确');
    cache = mergeDefaults(obj.data);
    await save();
    const jobs = Object.entries(obj.photos || {}).map(([id, url]) => putPhoto(id, url));
    await Promise.all(jobs);
    return true;
  }

  return {
    init, isRemote, isCloud, getCloudError, enableCloud, disableCloud,
    listCloudGists, connectCloudGist,
    get cloudCfg() { return cloud; },
    load, save, addPhoto, getPhoto, deletePhoto, putPhoto, compressImage,
    getVersion, startSync, exportBackup, importBackup
  };
})();

</script>
<script>
/* ============================================================
 * 袁珞宸的成长地图 · 应用逻辑
 * 页面：home / books / honors / checkin / feet
 * 模式：孩子模式（默认） / 家长模式（长按星星 3 秒）
 * ============================================================ */

let S = null;              // 全局数据
let PARENT = false;        // 家长模式
const APP_VERSION = 'v1.8';
let currentPage = 'home';
let booksFilter = { mode: 'all', year: null };
let honorsFilter = 'all';
let selectedFootprint = null;
let checkinMonth = null;   // 打卡月度视图：'YYYY-MM'，null = 当前月
let longPressTimer = null;

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayStr = (d = new Date()) => {
  const z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
};
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${y}.${m}.${d}`; };
const uid = () => 'r' + Date.now() + Math.floor(Math.random() * 10000);
const weekStart = (d = new Date()) => {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 1800);
}

function celebrate() {
  const box = document.createElement('div');
  box.className = 'celebrate';
  const emos = ['⭐', '🎉', '✨', '🌟', '🏆', '📚', '💪'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('i');
    p.textContent = emos[Math.floor(Math.random() * emos.length)];
    p.style.left = (4 + Math.random() * 92) + '%';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2200);
}

function save() { return DB.save(); }

/* 照片异步填充：<img data-photo="id"> */
function hydratePhotos(root = document) {
  $$('img[data-photo]', root).forEach(async img => {
    if (img.src) return;
    const url = await DB.getPhoto(img.dataset.photo);
    if (url) { img.src = url; img.classList.remove('ph'); }
  });
}

/* ---------- 路由 ---------- */
function showPage(name) {
  currentPage = name;
  $$('.page').forEach(p => p.classList.remove('active'));
  $('#page-' + name).classList.add('active');
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.page === name));
  const renderers = { home: renderHome, books: renderBooks, honors: renderHonors, checkin: renderCheckin, feet: renderFeet };
  renderers[name] && renderers[name]();
  window.scrollTo(0, 0);
}

/* ============================================================
 * 首页
 * ============================================================ */
async function renderHome() {
  const st = S.settings;
  const bg = $('#homeBg');
  if (st.bgPhotoId) {
    const url = await DB.getPhoto(st.bgPhotoId);
    if (url) { bg.style.backgroundImage = `url(${url})`; bg.style.backgroundSize = 'cover'; }
  } else {
    bg.style.backgroundImage = '';
  }
  $('.home-bg .dim').style.background = `linear-gradient(180deg,rgba(30,40,60,.04),rgba(30,40,60,${0.04 + st.bgDim * 0.6}))`;

  const books = bookStats();
  const syncPill = $('#syncPill');
  if (syncPill) syncPill.innerHTML = `<i class="sync-dot"></i>${DB.isCloud() ? '☁️ 云端已同步' : DB.isRemote() ? '家庭云 · 多设备实时同步' : '本机已保存 · 可备份迁移'}`;
  const todayDone = S.checkins.filter(c => c.date === todayStr() && c.done).length;
  const todayTotal = st.checkinItems.length + st.customItems.length;
  const honorN = S.honors.length;
  const cities = new Set(S.footprints.map(f => f.city)).size;

  $('#greetName').textContent = st.childName + '的成长地图';
  $('#homeMeta').textContent = `今天也有一点点长大 ⭐ · 今日成长能量 ${todayTotal ? Math.round(todayDone / todayTotal * 100) : 0}%`;

  $('#tileBooks').textContent = `已读 ${books.distinct} 本` + (S.books.some(b => b.isSeries) ? ` · 含 ${S.books.filter(b => b.isSeries).length} 套套书` : '');
  $('#tileHonors').textContent = `收集 ${honorN} 枚奖章`;
  $('#tileCheckin').textContent = `${todayDone} / ${todayTotal} 项完成`;
  $('#tileFeet').textContent = `已点亮 ${cities} 座城市`;

  /* 本周成长进度 */
  const ws = weekStart();
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); if (d <= new Date()) days.push(todayStr(d)); }
  const totalItems = days.length * todayTotal;
  const doneItems = S.checkins.filter(c => c.done && days.includes(c.date)).length;
  const pct = totalItems ? Math.min(100, Math.round(doneItems / totalItems * 100)) : 0;
  $('#weekBar').style.width = pct + '%';
  $('#weekPct').textContent = pct + '%';

  const tips = st.encouragements;
  const idx = (new Date().getDate() + new Date().getMonth()) % tips.length;
  $('#homeTip').textContent = '💬 “' + tips[idx] + '”';

  hydratePhotos();
}

function pickBackground() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    try {
      const id = await DB.addPhoto(inp.files[0]);
      if (S.settings.bgPhotoId) DB.deletePhoto(S.settings.bgPhotoId);
      S.settings.bgPhotoId = id;
      await save();
      renderHome();
      toast('背景换好啦 🖼️');
    } catch (e) { alert('照片处理失败，请换一张试试'); }
  };
  inp.click();
}

/* 长按星星 3 秒 → 家长模式 */
function bindStar() {
  const btn = $('#starBtn');
  const bar = $('#parentProgress');
  const start = e => {
    e.preventDefault();
    btn.classList.add('pressing');
    bar.style.transition = 'width 3s linear';
    bar.style.width = '100%';
    longPressTimer = setTimeout(openParent, 3000);
  };
  const cancel = () => {
    clearTimeout(longPressTimer);
    btn.classList.remove('pressing');
    bar.style.transition = 'width .2s';
    bar.style.width = '0%';
  };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', cancel);
  btn.addEventListener('pointerleave', cancel);
  btn.addEventListener('pointercancel', cancel);
}

/* ============================================================
 * 书单
 * ============================================================ */
function bookTimes(b) { return b.records.length; }
function bookLastDate(b) { return b.records.reduce((m, r) => r.date > m ? r.date : m, ''); }
function bookDoneVolumes(b) { return b.isSeries ? new Set(b.records.map(r => r.volume)).size : 1; }

function bookStats() {
  let distinct = 0, times = 0;
  for (const b of S.books) { distinct += bookDoneVolumes(b); times += b.records.length; }
  return { distinct, times };
}

function bookYears() {
  const ys = new Set();
  S.books.forEach(b => b.records.forEach(r => ys.add(r.date.slice(0, 4))));
  return Array.from(ys).sort().reverse();
}

function sortedBooks() {
  const list = S.books.slice();
  if (booksFilter.mode === 'count') {
    list.sort((a, b) => bookTimes(b) - bookTimes(a) || (bookLastDate(b) || '0').localeCompare(bookLastDate(a) || '0'));
  } else {
    list.sort((a, b) => (bookLastDate(b) || '0').localeCompare(bookLastDate(a) || '0'));
  }
  if (booksFilter.mode === 'year' && booksFilter.year) {
    return list.filter(b => b.records.some(r => r.date.startsWith(booksFilter.year)));
  }
  return list;
}

async function renderBooks() {
  const years = bookYears();
  const stats = bookStats();
  let html = `
    <div class="chips">
      <button class="chip ${booksFilter.mode === 'all' ? 'on' : ''}" data-bf="all">全部</button>
      <button class="chip ${booksFilter.mode === 'year' ? 'on' : ''}" data-bf="year">按年份 📅</button>
      <button class="chip ${booksFilter.mode === 'count' ? 'on' : ''}" data-bf="count">按阅读次数 🔥</button>
    </div>`;
  if (booksFilter.mode === 'year') {
    html += `<div class="chips" style="margin-top:8px;">` +
      years.map(y => `<button class="chip ${booksFilter.year === y ? 'on' : ''}" data-by="${y}">${y}年</button>`).join('') +
      (years.length ? '' : '<span class="muted">还没有阅读记录</span>') + `</div>`;
  }
  html += `<div class="sort-note"><span>排序规则</span><b>阅读次数 ↓ ＋ 最近读完 ↓</b></div>
    <div class="stat-duo">
      <div class="stat-box t-blue"><div class="num">${stats.distinct}<span> 本</span></div><div class="lab">读过多少本（不同书）</div></div>
      <div class="stat-box t-yellow"><div class="num">${stats.times}<span> 次</span></div><div class="lab">累计阅读次数</div></div>
    </div>
    <div id="bookList" style="display:flex;flex-direction:column;gap:11px;">`;

  for (const b of sortedBooks()) {
    if (b.isSeries) {
      const done = new Set(b.records.map(r => r.volume));
      const next = Array.from({ length: b.totalVolumes }, (_, i) => i + 1).find(n => !done.has(n));
      const cells = Array.from({ length: b.totalVolumes }, (_, i) => i + 1).map(n =>
        `<button class="vol ${done.has(n) ? 'done' : 'todo'}" data-vol="${b.id}|${n}">${n}</button>`).join('');
      html += `<div class="series">
        <div class="head"><span class="name">${esc(b.title)}</span><span class="badge-set">套书 · 全${b.totalVolumes}册</span></div>
        <div class="item-meta">${esc(b.author || '')} · 已完成 ${done.size} / ${b.totalVolumes} 册 · 点某一册即可打卡</div>
        <div class="vol-dots">${cells}</div>
        <div class="foot">${next ? `🐾 点亮下一册：第${next}册 → 点上面的格子打卡完成` : '🏅 全套通关！太厉害啦！'}</div>
      </div>`;
    } else {
      const last = bookLastDate(b);
      html += `<div class="list-card" data-book="${b.id}">
        ${b.records.find(r => r.photoId) ? `<img class="thumb" data-photo="${b.records.find(r => r.photoId).photoId}">` : `<div class="thumb ph">📖</div>`}
        <div class="item-main"><div class="item-name">${esc(b.title)}</div>
          <div class="item-meta">${esc(b.author || '作者未填')} · 最近读完 ${fmtDate(last)}</div></div>
        <div class="count-tag">读过<br>${b.records.length} 次</div>
      </div>`;
    }
  }
  if (!S.books.length) html += `<div class="card muted" style="text-align:center;padding:24px;">书架还是空的，记录你读完的第一本书吧 📖</div>`;
  html += `</div>
    <button class="cta" id="addBookBtn">＋ 记录我读完的一本书</button>
    ${PARENT ? `<div class="chips" style="margin-top:10px;">
      <button class="chip" id="expBooksCsv">📤 导出Excel</button>
      <button class="chip" id="expBooksPdf">🖨️ 打印PDF</button>
    </div>` : ''}`;

  $('#page-books').innerHTML = `
    <div class="statusbar-space" style="height:2px;"></div>
    <div><div class="kicker">BOOK JOURNEY</div><h2 class="title">我的书单</h2></div>` + html;
  bindBooks();
  hydratePhotos();
}

function bindBooks() {
  $$('#page-books [data-bf]').forEach(c => c.onclick = () => { booksFilter.mode = c.dataset.bf; booksFilter.year = null; renderBooks(); });
  $$('#page-books [data-by]').forEach(c => c.onclick = () => { booksFilter.year = c.dataset.by; renderBooks(); });
  $$('#page-books [data-vol]').forEach(c => c.onclick = () => {
    const [bookId, vol] = c.dataset.vol.split('|');
    tapVolume(bookId, +vol);
  });
  $$('#page-books [data-book]').forEach(c => c.onclick = () => openBookDetail(c.dataset.book));
  $('#addBookBtn').onclick = () => openBookForm();
  const a = $('#expBooksCsv'), p = $('#expBooksPdf');
  if (a) a.onclick = exportBooksCsv;
  if (p) p.onclick = () => buildPrint('books');
}

async function tapVolume(bookId, vol) {
  const b = S.books.find(x => x.id === bookId);
  if (!b) return;
  const volRecs = b.records.filter(r => r.volume === vol);
  if (volRecs.length) {
    /* 已读过：展示该册全部阅读记录，支持再读一次 */
    openSheet(`
      <h3>📖 ${esc(b.title)} 第${vol}册</h3>
      <div class="muted" style="margin-bottom:12px;">这一册已经读过 ${volRecs.length} 次，每次阅读都会记录下来</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        ${volRecs.slice().sort((a, b2) => (b2.date || '').localeCompare(a.date || '')).map(r => `
          <div class="memory"><div class="head">
            <span class="name" style="font-size:12px;color:var(--ink);">${r.date === todayStr() ? '今天' : fmtDate(r.date)}读完</span>
            ${PARENT ? `<button class="btn-mini warn" data-vdel="${esc(r.createdAt || r.date)}">删除</button>` : ''}
          </div>
          ${r.note ? `<div class="quote">💬 ${esc(r.note)}</div>` : ''}
          ${r.photoId ? `<div class="pics"><img data-photo="${r.photoId}"></div>` : ''}</div>`).join('')}
      </div>
      <button class="cta green" id="volReread">🔁 第${vol}册我又读了一遍（+1次）</button>
    `);
    hydratePhotos();
    $('#volReread').onclick = async () => {
      b.records.push({ date: todayStr(), volume: vol, note: '', photoId: null, createdAt: new Date().toISOString() });
      await save(); closeSheet(); celebrate(); renderBooks();
      toast(`第${vol}册阅读次数 +1 🔥`);
    };
    $$('#sheetBody [data-vdel]').forEach(btn => btn.onclick = async () => {
      const r = volRecs.find(x => (x.createdAt || x.date) === btn.dataset.vdel);
      if (r && confirm(`删除 ${fmtDate(r.date)} 这条阅读记录？`)) {
        b.records = b.records.filter(x => x !== r);
        if (r.photoId) DB.deletePhoto(r.photoId);
        await save(); closeSheet(); renderBooks();
      }
    });
    return;
  }
  /* 未读过：打卡点亮 */
  openSheet(`
    <h3>🐾 打卡完成：${esc(b.title)} 第${vol}册</h3>
    <div class="field"><label>读完日期</label><input type="date" id="volDate" value="${todayStr()}" max="${todayStr()}"></div>
    <div class="field"><label>阅读感受（可选）</label><textarea id="volNote" placeholder="这本书讲了什么？你喜欢哪部分？"></textarea></div>
    <div class="field"><label>照片（可选）</label><div class="photo-pick" id="volPhoto"><div class="ph-slot" onclick="pickSheetPhoto('volPhoto')">📷</div></div></div>
    <div class="sheet-actions"><button class="cta cancel" onclick="closeSheet()">取消</button><button class="cta" id="volSave">打卡完成 ✅</button></div>
  `);
  $('#volSave').onclick = async () => {
    b.records.push({ date: $('#volDate').value || todayStr(), volume: vol, note: $('#volNote').value.trim(), photoId: sheetPhotoId, createdAt: new Date().toISOString() });
    await save(); closeSheet(); celebrate(); renderBooks();
    toast(`第${vol}册点亮啦！`);
  };
}

let sheetPhotoId = null;

    try {

/* ============================================================
 * 每日打卡
 * ============================================================ */
function checkinCategory(item) {
  if (['阅读', '亲子阅读', '绘本'].includes(item)) return '阅读';
  if (['运动', '轮滑', '游泳', '跑步', '球类'].includes(item)) return '运动';
  return '学习';
}
function streakDays() {
  let n = 0;
  const d = new Date();
  for (;;) {
    const s = todayStr(d);
    const has = S.checkins.some(c => c.date === s && c.done);
    if (has) { n++; d.setDate(d.getDate() - 1); }
    else if (n === 0 && s === todayStr()) { d.setDate(d.getDate() - 1); } // 今天还没打，从昨天算
    else break;
    if (n > 999) break;
  }
  return n;
}

async function renderCheckin() {
  const today = todayStr();
  const items = [...S.settings.checkinItems, ...S.settings.customItems];
  const recs = items.map(it => S.checkins.find(c => c.date === today && c.item === it) || { item: it, done: false, minutes: null });
  const doneN = recs.filter(r => r.done).length;

  /* 分类时间分布（本周） */
  const ws = weekStart(), wsStr = todayStr(ws);
  const weekRecs = S.checkins.filter(c => c.done && c.date >= wsStr && c.minutes);
  const catMin = { '学习': 0, '阅读': 0, '运动': 0 };
  weekRecs.forEach(c => { catMin[checkinCategory(c.item)] += c.minutes || 0; });
  const maxCat = Math.max(1, ...Object.values(catMin));

  /* 本周完成率 */
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); if (d <= new Date()) days.push(todayStr(d)); }
  const wkDone = S.checkins.filter(c => c.done && days.includes(c.date)).length;
  const wkTotal = days.length * items.length;
  const wkRate = wkTotal ? Math.round(wkDone / wkTotal * 100) : 0;
  const monthMinutes = S.checkins.filter(c => c.done && c.minutes && c.date.startsWith(today.slice(0, 7))).reduce((s, c) => s + c.minutes, 0);

  /* ===== 月度趋势与沉淀对比 ===== */
  const now = new Date();
  if (!checkinMonth) checkinMonth = today.slice(0, 7);
  const [my, mm] = checkinMonth.split('-').map(Number);
  const daysInMonth = new Date(my, mm, 0).getDate();
  const isCurrentMonth = checkinMonth === today.slice(0, 7);
  const elapsedDays = isCurrentMonth ? now.getDate() : daysInMonth;
  const mRecs = S.checkins.filter(c => c.done && c.date.startsWith(checkinMonth));
  const mDone = mRecs.length;
  const mMin = mRecs.reduce((s, c) => s + (c.minutes || 0), 0);
  const mRate2 = items.length && elapsedDays ? Math.min(100, Math.round(mDone / (items.length * elapsedDays) * 100)) : 0;
  const mDayCount = new Set(mRecs.map(c => c.date)).size;
  const daily = {};
  mRecs.forEach(c => { daily[c.date] = (daily[c.date] || 0) + 1; });
  const maxDaily = Math.max(1, ...Object.values(daily));
  const prevMonth = mm === 1 ? (my - 1) + '-12' : my + '-' + String(mm - 1).padStart(2, '0');
  const pRecs = S.checkins.filter(c => c.done && c.date.startsWith(prevMonth));
  const pMin = pRecs.reduce((s, c) => s + (c.minutes || 0), 0);
  const minDiff = mMin - pMin;
  const monthLabel = checkinMonth.replace('-', '年') + '月';
  const monthCardHtml = `
    <div class="card">
      <div class="chips" style="margin-bottom:4px;">
        <button class="chip" id="mPrev">‹</button>
        <button class="chip on" style="min-width:96px;text-align:center;">📊 ${monthLabel}</button>
        <button class="chip" id="mNext" ${isCurrentMonth ? 'style="opacity:.4;"' : ''}>›</button>
        ${!isCurrentMonth ? '<button class="chip" id="mNow">回到本月</button>' : ''}
      </div>
      <div class="stat-quad">
        <div class="stat-box t-green"><div class="num">${mDayCount}<span> 天</span></div><div class="lab">打卡天数</div></div>
        <div class="stat-box t-yellow"><div class="num">${mDone}<span> 项</span></div><div class="lab">完成项目</div></div>
        <div class="stat-box t-blue"><div class="num">${mMin}<span> 分</span></div><div class="lab">累计用时</div></div>
        <div class="stat-box t-pink"><div class="num">${mRate2}<span> %</span></div><div class="lab">完成率</div></div>
      </div>
      <div style="font-size:11px;color:var(--ink-soft);margin-top:12px;font-weight:700;">每日完成情况（高峰 ${maxDaily} 项/天）</div>
      <div class="daybars">${Array.from({ length: daysInMonth }, (_, i) => {
        const ds = checkinMonth + '-' + String(i + 1).padStart(2, '0');
        const v = daily[ds] || 0;
        const h = Math.round(v / maxDaily * 100);
        const future = isCurrentMonth && i + 1 > now.getDate();
        return `<i style="height:${future ? 2 : Math.max(4, h)}%;${ds === today ? 'background:var(--accent);opacity:1;' : ''}${future ? 'background:#EFE8D5;' : ''}" title="${i + 1}日 ${v} 项"></i>`;
      }).join('')}</div>
      <div class="daybar-axis"><span>1</span><span>${Math.round(daysInMonth / 2)}</span><span>${daysInMonth}</span></div>
      <div class="muted" style="margin-top:10px;">
        📊 对比${prevMonth.replace('-', '年')}月：用时 <b style="color:${minDiff >= 0 ? 'var(--accent-3)' : 'var(--danger);'};">${minDiff >= 0 ? '+' : ''}${minDiff}</b> 分钟
        （上月 ${pMin} 分钟）· 完成项目 ${mDone} 项（上月 ${pRecs.length} 项）
      </div>
    </div>`;

  let html = `<div class="medal-hero" style="background:var(--green);">
      <div class="medal-ball" style="background:radial-gradient(circle at 32% 30%,#BFF0CD,#5CB878 75%);"></div>
      <div><div style="font-size:20px;font-weight:900;">今日已完成 ${doneN} / ${items.length}</div>
      <div class="muted">${doneN === items.length ? '全部完成！今天集齐所有星星啦 🌟' : '再坚持一下，就集齐今天的星星 🌟'}</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;">`;
  for (const r of recs) {
    html += `<div class="check-row">
      <button class="check-dot ${r.done ? 'done' : 'todo'}" data-toggle="${esc(r.item)}">${r.done ? '✓' : '＋'}</button>
      <span class="name">${esc(r.item)}</span>
      <button class="min-tag ${r.minutes ? '' : 'none'}" data-min="${esc(r.item)}">${r.minutes ? r.minutes + ' 分钟' : '记时间'}</button>
    </div>`;
  }
  html += `</div>
    <button class="cta ghost" id="addItemBtn">＋ 添加自定义打卡项目</button>
    <div class="stat-duo">
      <div class="stat-box t-green"><div class="num">${streakDays()}<span> 天</span></div><div class="lab">连续打卡</div></div>
      <div class="stat-box t-blue"><div class="num">${wkRate}<span> %</span></div><div class="lab">本周完成率</div></div>
    </div>
    <div class="card">
      <div class="row1" style="font-size:13px;font-weight:800;margin-bottom:8px;">⏱️ 本周时间分布（累计 ${weekRecs.reduce((s, c) => s + c.minutes, 0)} 分钟）</div>
      ${Object.entries(catMin).map(([k, v]) => `
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
          <span style="font-size:11px;width:34px;font-weight:700;">${k}</span>
          <div class="bar" style="flex:1;margin-top:0;"><i style="width:${Math.round(v / maxCat * 100)}%;background:${k === '学习' ? 'linear-gradient(90deg,#4A90D9,#7FB3E8)' : k === '阅读' ? 'linear-gradient(90deg,#F5A623,#FFC95C)' : 'linear-gradient(90deg,#5CB878,#8FD9A5)'}"></i></div>
          <span style="font-size:11px;color:var(--ink-soft);width:52px;text-align:right;">${v} 分钟</span>
        </div>`).join('')}
    </div>
    <div class="card muted">📅 本月已累计 <b style="color:var(--accent);">${monthMinutes}</b> 分钟 · 哪个项目坚持最好，哪个月容易中断，家长模式可查看完整数据</div>
    ${monthCardHtml}
    ${PARENT ? `<div class="chips"><button class="chip" id="expCheckinCsv">📤 导出打卡Excel</button><button class="chip" id="expCheckinPdf">🖨️ 打印PDF</button></div>` : ''}`;

  /* 月度趋势：切换月份 */
  const goMonth = (delta) => {
    const [y, m] = (checkinMonth || todayStr().slice(0, 7)).split('-').map(Number);
    let ny = y, nm = m + delta;
    if (nm < 1) { nm = 12; ny--; }
    if (nm > 12) { nm = 1; ny++; }
    const nowM = todayStr().slice(0, 7);
    if (ny + '-' + String(nm).padStart(2, '0') > nowM) return; // 不能看未来
    checkinMonth = ny + '-' + String(nm).padStart(2, '0');
    renderCheckin();
  };
  const prev = $('#mPrev'), next = $('#mNext'), nowBtn = $('#mNow');
  if (prev) prev.onclick = () => goMonth(-1);
  if (next) next.onclick = () => goMonth(1);
  if (nowBtn) nowBtn.onclick = () => { checkinMonth = todayStr().slice(0, 7); renderCheckin(); };

  $('#page-checkin').innerHTML = `
    <div><div class="kicker">TODAY'S QUEST</div><h2 class="title">今日打卡</h2>
    <div class="muted">${today.replace(/-/g, '.')} · 完成一项，就点亮成长地图的一格</div></div>` + html;

  $$('#page-checkin [data-toggle]').forEach(b => b.onclick = async () => {
    const item = b.dataset.toggle;
    let rec = S.checkins.find(c => c.date === today && c.item === item);
    if (!rec) { rec = { id: uid(), date: today, item, done: false, minutes: null, note: '', photoId: null, createdAt: new Date().toISOString() }; S.checkins.push(rec); }
    rec.done = !rec.done;
    if (rec.done && !rec.minutes) { rec.minutes = +prompt(`「${item}」用了多少分钟？`, 15) || 15; }
    await save();
    if (rec.done) { celebrate(); toast('点亮一格 ⭐'); } else toast('已取消');
    renderCheckin(); if (currentPage === 'home') renderHome();
  });
  $$('#page-checkin [data-min]').forEach(b => b.onclick = () => {
    const item = b.dataset.min;
    const rec = S.checkins.find(c => c.date === today && c.item === item) || { done: false };
    const m = +prompt(`「${item}」实际用了多少分钟？`, rec.minutes || 15);
    if (!m) return;
    let r = S.checkins.find(c => c.date === today && c.item === item);
    if (!r) { r = { id: uid(), date: today, item, done: false, minutes: m, note: '', photoId: null, createdAt: new Date().toISOString() }; S.checkins.push(r); }
    r.minutes = m;
    save().then(() => { renderCheckin(); toast('时间已记录 ⏱️'); });
  });
  $('#addItemBtn').onclick = () => {
    const name = prompt('新打卡项目的名字？', '');
    if (!name || !name.trim()) return;
    S.settings.customItems.push(name.trim());
    save().then(() => { renderCheckin(); toast('项目已添加 ✅'); });
  };
  const a = $('#expCheckinCsv'), p = $('#expCheckinPdf');
  if (a) a.onclick = exportCheckinCsv;
  if (p) p.onclick = () => buildPrint('checkin');
}

/* ============================================================
 * 我的脚步（中国地图）
 * ============================================================ */
async function renderFeet() {
  const lit = S.footprints.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const cities = new Set(S.footprints.map(f => f.city));

  let pins = '';
  lit.forEach(f => {
    if (f.lon == null || f.lat == null) return;   // 海外记录不点亮国内地图
    const p = projectCity(f.lon, f.lat);
    pins += `<g class="map-pin" data-pin="${f.id}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="#F5A623" class="pin-glow"/>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#fff"/>
    </g>`;
  });
  S.wishes.forEach(w => {
    if (w.lon == null || w.lat == null) return;
    const p = projectCity(w.lon, w.lat);
    pins += `<g class="map-pin" data-pin="w_${w.id}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="#D8D2C0"/><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#fff"/></g>`;
  });

  /* 最近 3 次出发记录 */
  const recent = lit.slice(0, 3);
  let detail = `<div class="sort-note"><span>👣 最近的出发（点击查看详情${PARENT ? '，可修改' : ''}）</span><b style="font-size:10px;">近 3 次</b></div>`;
  if (recent.length) {
    detail += recent.map(footCard).join('');
  } else {
    detail += `<div class="card muted" style="text-align:center;">地图上还没有亮点，记录一次出发吧 👣</div>`;
  }

  $('#page-feet').innerHTML = `
    <div><div class="kicker">MY FOOTPRINTS</div><h2 class="title">我的脚步</h2>
    <div class="muted">去过哪里，就在地图上点亮哪里 ✨</div></div>
    <div class="map-wrap">
      <svg viewBox="0 0 660 480">
        <path class="land" d="${CHINA_MAIN_PATH}"/>
        ${pins}
        <g class="inset-group" transform="translate(556,336) scale(0.55)">
          <path class="land-sm" d="${CHINA_SOUTH_PATH}"/>
        </g>
      </svg>
      <div class="map-caption">已点亮 ${cities.size} 座城市${S.wishes.length ? ` · 想去 ${S.wishes.length} 个地方` : ''} · 点地图亮点看详情</div>
    </div>
    ${detail}
    <button class="cta" id="addFootBtn">＋ 记录一次新的出发</button>`;

  $$('#page-feet [data-pin]').forEach(g => g.onclick = () => {
    const id = g.dataset.pin;
    if (id.startsWith('w_')) {
      const w = S.wishes.find(x => x.id === id.slice(2));
      toast('想去的地方：' + (w ? w.city : ''));
      return;
    }
    openFootDetail(id);
  });
  $$('#page-feet [data-foot]').forEach(c => c.onclick = () => openFootDetail(c.dataset.foot));
  $('#addFootBtn').onclick = () => openFootForm();
  hydratePhotos();
}

/* 脚步记录卡（列表用） */
/* 脚步行程日期范围：单日只显示一天，多日显示 起始 ~ 结束 */
function footDateRange(f) {
  if (!f.endDate || f.endDate === f.date) return fmtDate(f.date);
  return fmtDate(f.date) + ' ~ ' + fmtDate(f.endDate);
}

function footCard(f) {
  return `<div class="memory" data-foot="${f.id}" style="cursor:pointer;">
    <div class="head"><span class="name">${esc(f.city)}${f.place ? ' · ' + esc(f.place) : ''}</span>
      <span class="date">${footDateRange(f)} · ${esc(f.type || '')}</span></div>
    ${f.seen ? `<div class="quote">👀 “${esc(f.seen)}”</div>` : ''}
    ${f.favorite ? `<div class="quote">💖 最喜欢：<b>${esc(f.favorite)}</b></div>` : ''}
    ${f.photoId ? `<div class="pics"><img data-photo="${f.photoId}"></div>` : ''}
    ${f.steps ? `<div class="steps">👣 走了约 ${f.steps} 步</div>` : ''}
    <div class="muted" style="font-size:9px;margin-top:4px;color:#B0A88F;">点击展开详情 ▾</div>
  </div>`;
}

/* 脚步详情弹层：完整信息 + 家长可修订 */
function openFootDetail(id) {
  const f = S.footprints.find(x => x.id === id);
  if (!f) return;
  const times = S.footprints.filter(x => x.city === f.city).length;
  openSheet(`
    <h3>📍 ${esc(f.city)} <span style="font-size:12px;color:var(--ink-soft);font-weight:600;">共 ${times} 次出发</span></h3>
    <div class="memory" style="margin-bottom:14px;">
      <div class="head"><span class="name">${esc(f.city)}${f.place ? ' · ' + esc(f.place) : ''}</span>
        <span class="date">${footDateRange(f)} · ${esc(f.type || '')}</span></div>
      <div class="loc">📍 ${esc(f.province || '')} ${esc(f.city)}</div>
      ${f.seen ? `<div class="quote">👀 我看到了：${esc(f.seen)}</div>` : ''}
      ${f.favorite ? `<div class="quote">💖 最喜欢 / 印象最深：<b>${esc(f.favorite)}</b></div>` : ''}
      ${f.photoId ? `<div class="pics"><img data-photo="${f.photoId}" style="width:88px;height:88px;"></div>` : ''}
      ${f.steps ? `<div class="steps">👣 走了约 ${f.steps} 步</div>` : ''}
      ${f.calibratedAt ? `<div class="muted" style="font-size:10px;margin-top:4px;color:#B0A88F;">✅ 家长已校准</div>` : ''}
    </div>
    <div class="sheet-actions">
      ${PARENT ? `<button class="cta cancel" id="fdEdit">✏️ 修改</button><button class="cta cancel" id="fdDel" style="color:var(--danger);">🗑️ 删除</button>` : ''}
      <button class="cta" onclick="closeSheet()">关闭</button>
    </div>
  `);
  hydratePhotos();
  if (PARENT) {
    $('#fdEdit').onclick = () => { closeSheet(); openFootForm(f); };
    $('#fdDel').onclick = async () => {
      if (confirm('删除这条脚步记录？此操作不可恢复。')) {
        if (f.photoId) DB.deletePhoto(f.photoId);
        S.footprints = S.footprints.filter(x => x.id !== f.id);
        await save(); closeSheet(); renderFeet(); toast('已删除');
      }
    };
  }
}

function openFootForm(edit) {
  sheetPhotoId = edit ? edit.photoId : null;
  /* 编辑时根据已有城市反查省份，初始化级联状态 */
  const editProv = edit ? (CITY_INDEX[edit.city] ? CITY_INDEX[edit.city].province : '') : '';
  const cascade = { country: edit ? (editProv || (edit.city ? '其他国家/地区' : '中国')) : '中国', province: editProv, city: edit ? (edit.city || '') : '' };
  openSheet(`
    <h3>${edit ? '✏️ 家长修改脚步' : '＋ 记录一次新的出发'}</h3>
    <div class="field"><label>城市 *（国家 → 省 → 市 依次选择）</label>
      <div id="ftCascade">
        <div class="chips" style="margin-bottom:6px;">
          <button type="button" class="chip cascade-country ${cascade.country === '中国' ? 'on' : ''}" data-country="中国">🇨🇳 中国</button>
          <button type="button" class="chip cascade-country ${cascade.country === '其他国家/地区' ? 'on' : ''}" data-country="其他国家/地区">🌍 其他国家</button>
          <span id="ftCityLabel" class="muted" style="font-size:12px;align-self:center;margin-left:4px;">已选：${esc(cascade.city || '未选择')}</span>

    <div class="field"><div class="row">
      <div style="flex:1;"><label>出发日期</label><input type="date" id="ftDate" value="${edit ? edit.date : todayStr()}" max="${todayStr()}"></div>

      <div style="flex:1;"><label>类型</label>
        <select id="ftType">${['旅行', '徒步', '亲子游', '比赛出行'].map(t => `<option ${edit && edit.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    </div></div>
    <div class="field"><label>我看到了什么</label><textarea id="ftSeen" placeholder="云海、古建筑、小动物……">${esc(edit ? edit.seen : '')}</textarea></div>
    <div class="field"><label>我最喜欢 / 印象最深的事</label><textarea id="ftFav" placeholder="最喜欢科技馆的机器人，它会跟我握手">${esc(edit ? edit.favorite : '')}</textarea></div>
    <div class="field"><label>走了多久 / 大约多少步（可选）</label><input type="number" id="ftSteps" value="${edit ? edit.steps || '' : ''}" placeholder="8000"></div>
    <div class="field"><label>现场照片（可选）</label><div class="photo-pick" id="ftPhoto">${sheetPhotoId ? '' : '<div class="ph-slot" onclick="pickSheetPhoto(\'ftPhoto\')">📷</div>'}</div></div>
    ${edit ? '' : `<div class="field"><label><input type="checkbox" id="ftWish" style="width:auto;margin-right:6px;">这是“想去”的地方（还没去，先在地图上做个灰色标记）</label></div>`}
    <div class="sheet-actions"><button class="cta cancel" onclick="closeSheet()">取消</button><button class="cta" id="ftSave">保存 ✅</button></div>
  `);
  if (sheetPhotoId) DB.getPhoto(sheetPhotoId).then(u => { $('#ftPhoto').innerHTML = u ? `<img src="${u}">` : '<div class="ph-slot" onclick="pickSheetPhoto(\'ftPhoto\')">📷</div>'; });

  /* 渲染省、市两级行 */
  function renderCascade() {
    const provRow = $('#ftProvinceRow'), cityRow = $('#ftCityRow');

      cityRow.innerHTML = '';

    cityRow.innerHTML = cascade.province ? `<div class="chips" style="margin-bottom:6px;max-height:120px;overflow-y:auto;">${PROVINCE_CITIES[cascade.province].map(c =>
      `<button type="button" class="chip cascade-city ${cascade.city === c[0] ? 'on' : ''}" data-city="${c[0]}">${c[0]}</button>`).join('')}</div>` : '';

  $$('#ftCascade [data-country]').forEach(b => b.onclick = () => {

    $('#ftCity').value = '';
    $$('#ftCascade [data-country]').forEach(x => x.classList.toggle('on', x === b));
    renderCascade(); updateCityLabel();
  });
  renderCascade();

  $('#ftSave').onclick = async () => {
    let cityName, lon, lat, province;
    if (cascade.country === '中国') {
      cityName = $('#ftCity').value.trim();
      const info = CITY_INDEX[cityName];
      if (!info) { alert('请先选省份，再从列表中点选城市'); return; }
      lon = info.lon; lat = info.lat; province = info.province;

    }

      S.wishes.push({ id: uid(), city: cityName, lon: lon, lat: lat, createdAt: new Date().toISOString() });
      await save(); closeSheet(); renderFeet(); toast(lon == null ? '已标记想去 📍（海外暂不点亮国内地图）' : '已标记想去 📍'); return;
    }
    const base = {
      city: cityName, province: province, lon: lon, lat: lat, place: $('#ftPlace').value.trim(),
      date: $('#ftDate').value || todayStr(), endDate: $('#ftEndDate').value || $('#ftDate').value || todayStr(),
      type: $('#ftType').value,
      seen: $('#ftSeen').value.trim(), favorite: $('#ftFav').value.trim(),
      steps: +$('#ftSteps').value || null, photoId: sheetPhotoId
    };
    if (edit) {
      if (!edit._orig) edit._orig = JSON.parse(JSON.stringify({ city: edit.city, place: edit.place, date: edit.date, type: edit.type, seen: edit.seen, favorite: edit.favorite, steps: edit.steps }));
      Object.assign(edit, base, { calibratedAt: new Date().toISOString() });
    } else {
      S.footprints.push(Object.assign({ id: uid(), createdAt: new Date().toISOString() }, base));
    }
    selectedFootprint = edit ? edit.id : null;
    await save(); closeSheet(); celebrate(); renderFeet();
    toast('地图点亮啦 ✨');
  };
}

    : null;
  if (DB.isRemote() === false && (backupDays === null || backupDays > 14)) {
    setTimeout(() => toast('💡 建议先备份一次数据，防止换手机丢失'), 1200);
  }
  const backupLabel = backupDays === null ? '💾 备份数据' : backupDays === 0 ? '✅ 今天已备份' : `💾 备份数据（${backupDays}天前）`;
  /* 合并所有记录用于校准列表 */
  const all = [];
  S.books.forEach(b => b.records.forEach(r => all.push({ kind: '阅读', date: r.date, text: (b.isSeries ? `${b.title} 第${r.volume}册` : b.title), ref: { type: 'book', b, r } })));
  S.honors.forEach(h => all.push({ kind: '荣誉', date: h.date, text: `${h.rank}：${h.name}`, ref: { type: 'honor', h } }));

  $('#pfBackup').onclick = async () => {
    const blob = new Blob([JSON.stringify(await DB.exportBackup())], { type: 'application/json' });

    a.href = URL.createObjectURL(blob);
    a.download = `成长地图备份_${todayStr()}.json`;
    a.click();

    await save();

  };
  $('#pfRestore').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';

      if (!inp.files[0]) return;
      if (!confirm('恢复备份会覆盖当前所有数据，确定继续吗？')) return;
      try {
        const obj = JSON.parse(await inp.files[0].text());
        await DB.importBackup(obj);

        closeSheet(); refresh();
        toast('数据已恢复 ✅');
      } catch (e) { alert('恢复失败：' + e.message); }

      save().then(() => { toast('已校准 ✅'); refresh(); });
    }
  });
  $$('#sheetBody [data-caldel]').forEach(b => b.onclick = async () => {
    const it = all[+b.dataset.caldel];

    else if (it.ref.type === 'honor') { if (it.ref.h.photoId) DB.deletePhoto(it.ref.h.photoId); S.honors = S.honors.filter(x => x.id !== it.ref.h.id); }
    else if (it.ref.type === 'checkin') S.checkins = S.checkins.filter(x => x.id !== it.ref.c.id);
    else if (it.ref.type === 'foot') { if (it.ref.f.photoId) DB.deletePhoto(it.ref.f.photoId); S.footprints = S.footprints.filter(x => x.id !== it.ref.f.id); }
    await save(); closeSheet(); refresh(); toast('已删除');
  });
}
