/* ============================================================
 * 导出：Excel(CSV) / PDF打印 / 图片分享
 * ============================================================ */
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function toCSV(headers, rows) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return '\uFEFF' + [headers.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n');
}

function exportBooksCsv() {
  const rows = [];
  S.books.forEach(b => {
    if (b.isSeries) {
      const done = new Set(b.records.map(r => r.volume));
      rows.push([b.title, b.author, `套书（全${b.totalVolumes}册）`, `已完成${done.size}册`, [...done].sort((a, b2) => a - b2).map(n => `第${n}册`).join('、'), b.records.length]);
    } else {
      b.records.forEach((r, i) => rows.push([b.title, b.author, '单本', i === 0 ? `第${i + 1}次读完` : `第${i + 1}次重读`, fmtDate(r.date), r.note || '']));
    }
  });
  const name = `袁珞宸书单_${booksFilter.mode === 'year' && booksFilter.year ? booksFilter.year + '年_' : ''}${todayStr()}.csv`;
  downloadFile(toCSV(['书名', '作者', '类型', '阅读情况', '读完日期 / 已点亮分册', '累计阅读次数'], rows), name, 'text/csv;charset=utf-8');
  toast('Excel(CSV) 已导出 📤');
}

function exportCheckinCsv() {
  const rows = S.checkins.slice().sort((a, b) => a.date.localeCompare(b.date)).map(c =>
    [fmtDate(c.date), c.item, c.done ? '完成' : '未完成', c.minutes || '', c.note || '']);
  downloadFile(toCSV(['日期', '项目', '状态', '用时(分钟)', '备注'], rows), `袁珞宸打卡记录_${todayStr()}.csv`, 'text/csv;charset=utf-8');
  toast('Excel(CSV) 已导出 📤');
}

/* 打印 PDF（浏览器打印为 PDF） */
function buildPrint(kind) {
  const st = S.settings;
  let html = `<h1>${esc(st.childName)}的成长记录</h1><div class="p-sub">打印时间：${fmtDate(todayStr())} · ${esc(st.signature)}</div>`;
  if (kind === 'books') {
    const stats = bookStats();
    html += `<div class="p-sec">📚 书单（共 ${stats.distinct} 本 / ${stats.times} 次）</div>
      <table><tr><th>书名</th><th>作者</th><th>类型</th><th>阅读情况</th><th>日期 / 分册</th></tr>`;
    S.books.forEach(b => {
      if (b.isSeries) {
        const done = new Set(b.records.map(r => r.volume));
        html += `<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>套书</td><td>已完成${done.size}/${b.totalVolumes}册</td><td>${[...done].sort((a, b2) => a - b2).map(n => n).join('、')}</td></tr>`;
      } else {
        b.records.forEach((r, i) => html += `<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>单本</td><td>第${i + 1}次</td><td>${fmtDate(r.date)}</td></tr>`);
      }
    });
    html += `</table>`;
  } else if (kind === 'checkin') {
    html += `<div class="p-sec">✅ 每日打卡记录</div>
      <table><tr><th>日期</th><th>项目</th><th>状态</th><th>用时(分钟)</th></tr>`;
    S.checkins.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(c =>
      html += `<tr><td>${fmtDate(c.date)}</td><td>${esc(c.item)}</td><td>${c.done ? '完成' : '未完成'}</td><td>${c.minutes || ''}</td></tr>`);
    html += `</table>`;
  } else if (kind === 'honors') {
    html += `<div class="p-sec">🏆 荣誉榜（共 ${S.honors.length} 项）</div>
      <table><tr><th>时间</th><th>名称</th><th>名次</th><th>类别</th><th>项目</th></tr>`;
    S.honors.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(h =>
      html += `<tr><td>${fmtDate(h.date)}</td><td>${esc(h.name)}</td><td>${h.rank}</td><td>${esc(h.category)}</td><td>${esc(h.event)}</td></tr>`);
    html += `</table>`;
  } else if (kind === 'feet') {
    html += `<div class="p-sec">👣 成长脚步（点亮 ${new Set(S.footprints.map(f => f.city)).size} 座城市）</div>
      <table><tr><th>日期</th><th>城市</th><th>类型</th><th>看到了什么</th><th>最喜欢的事</th></tr>`;
    S.footprints.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(f =>
      html += `<tr><td>${fmtDate(f.date)}</td><td>${esc(f.city)}${f.place ? '·' + esc(f.place) : ''}</td><td>${esc(f.type)}</td><td>${esc(f.seen)}</td><td>${esc(f.favorite)}</td></tr>`);
    html += `</table>`;
  }
  $('#printArea').innerHTML = html;
  window.print();
}

/* 图片分享长图 */
async function shareImage() {
  const W = 900, H = 1400;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#8FC7E8'); grad.addColorStop(.55, '#BFE0C8'); grad.addColorStop(1, '#F6E7A8');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(30,40,60,.12)'; ctx.fillRect(0, 0, W, H);

  const bs = bookStats();
  const cities = new Set(S.footprints.map(f => f.city)).size;
  const gold = S.honors.filter(h => h.rank === '冠军').length;
  const streak = streakDays();

  ctx.fillStyle = '#fff';
  ctx.font = '800 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(S.settings.childName + '的成长地图', 60, 120);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = '600 24px "PingFang SC",sans-serif';
  ctx.fillText('我的成长小报告 · ' + fmtDate(todayStr()), 60, 170);

  const cards = [
    ['📚', bs.distinct + ' 本', '读过多少本书'],
    ['🔥', bs.times + ' 次', '累计阅读次数'],
    ['🏆', S.honors.length + ' 枚', `荣誉勋章（${gold}金）`],
    ['👣', cities + ' 座', '点亮的城市'],
    ['✅', streak + ' 天', '连续打卡']
  ];
  cards.forEach((c, i) => {
    const isWide = i === 4;
    const x = 55, y = 220 + (isWide ? 2 : Math.floor(i / 2)) * 180;
    const w = isWide ? 795 : 380;
    const dx = isWide ? x : x + (i % 2) * 410;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    roundRect(ctx, dx, y, w, 150, 24); ctx.fill();
    ctx.font = '40px serif';
    ctx.fillText(c[0], dx + 28, y + 62);
    ctx.fillStyle = '#3A3A3A';
    ctx.font = '900 42px "PingFang SC",sans-serif';
    ctx.fillText(c[1], dx + 92, y + 68);
    ctx.fillStyle = '#8A8578';
    ctx.font = '600 24px "PingFang SC",sans-serif';
    ctx.fillText(c[2], dx + 92, y + 112);
  });

  /* 最近读完的书 */
  ctx.fillStyle = '#3A3A3A';
  ctx.font = '800 30px "PingFang SC",sans-serif';
  ctx.fillText('📖 最近读的书', 60, 850);
  ctx.font = '600 26px "PingFang SC",sans-serif';
  ctx.fillStyle = '#4A4638';
  const recent = S.books.slice().sort((a, b) => (bookLastDate(b) || '').localeCompare(bookLastDate(a) || '')).slice(0, 5);
  recent.forEach((b, i) => {
    ctx.fillText(`${i + 1}. ${b.title}${b.isSeries ? `（已点亮${bookDoneVolumes(b)}/${b.totalVolumes}册）` : ` · ${bookTimes(b)}次`}`, 60, 900 + i * 46);
  });

  /* 最新荣誉 */
  ctx.fillStyle = '#3A3A3A';
  ctx.font = '800 30px "PingFang SC",sans-serif';
  ctx.fillText('🏆 最新荣誉', 60, 1160);
  ctx.font = '600 26px "PingFang SC",sans-serif';
  ctx.fillStyle = '#4A4638';
  S.honors.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 2).forEach((h, i) => {
    ctx.fillText(`${RANKS[h.rank] || '🏅'} ${h.name}（${h.rank} · ${fmtDate(h.date)}）`, 60, 1210 + i * 46);
  });

  ctx.fillStyle = 'rgba(60,50,20,.55)';
  ctx.font = '600 22px "PingFang SC",sans-serif';
  ctx.fillText(S.settings.signature + ' · 袁珞宸的成长地图', 60, 1360);

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = `袁珞宸成长分享_${todayStr()}.png`;
  a.click();
  toast('分享图片已生成 🖼️');
}

    <div style="display:flex;flex-direction:column;gap:9px;">

      <button class="cta green" id="ec3">🏆 荣誉 · PDF 打印版</button>
      <button class="cta ghost" id="ec4">👣 脚步 · PDF 打印版</button>
      <button class="cta ghost" id="ec5">🖼️ 生成图片分享版</button>

  $('#ec5').onclick = () => { closeSheet(); shareImage(); };
}

/* ============================================================
 * 弹层管理
 * ============================================================ */
function openSheet(html) {
  sheetPhotoId = null;
  $('#sheetBody').innerHTML = html;
  $('#overlay').classList.add('show');
}
function closeSheet() { $('#overlay').classList.remove('show'); $('#sheetBody').innerHTML = ''; sheetPhotoId = null; }

/* ============================================================
 * 启动
 * ============================================================ */
async function init() {
  await DB.init();
  S = await DB.load();
  bindStar();
  $$('.tab').forEach(t => t.onclick = () => showPage(t.dataset.page));
  $('#bgBtn').onclick = pickBackground;
  $('#overlay').onclick = e => { if (e.target === $('#overlay')) closeSheet(); };
  showPage('home');
  /* 家庭云模式：轮询同步，其他设备有新记录时自动刷新 */
  DB.startSync(data => {
    S = data;
    refresh();
    toast('已同步其他设备的最新记录 🔄');
  });
}
document.addEventListener('DOMContentLoaded', init);
